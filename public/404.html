<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 · 页面不存在 | HXZg</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0d1117; color: #e6edf3;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
    }
    .wrap { text-align: center; padding: 2rem; }
    .code {
      font-size: 8rem; font-weight: 800; line-height: 1;
      background: linear-gradient(135deg, #58a6ff, #3fb950);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .title { font-size: 1.5rem; font-weight: 600; margin: 1rem 0 0.5rem; }
    .desc { color: #8b949e; font-size: 1rem; margin-bottom: 2rem; }
    .btn {
      display: inline-block; padding: 0.75rem 2rem;
      background: #58a6ff; color: #0d1117;
      border-radius: 8px; font-weight: 600; font-size: 0.95rem;
      text-decoration: none; transition: all 0.2s;
    }
    .btn:hover { background: #79b8ff; transform: translateY(-2px); }
    .emoji { font-size: 4rem; margin-bottom: 1rem; display: block; }
  </style>
</head>
<body>
  <div class="wrap">
    <span class="emoji">🔭</span>
    <div class="code">404</div>
    <div class="title">页面不存在</div>
    <div class="desc">你访问的页面已经飞到外太空了...</div>
    <a href="./" class="btn">← 回到首页</a>
  </div>
</body>
</html>
